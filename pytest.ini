[pytest]
# pytest 配置。Two test roots:
#   pg-dict/scripts/render_test.py — render.py merge/idempotency/scope fixture
#     tests (stdlib unittest.TestCase classes; pytest discovers/runs them
#     natively, no shim needed).
#   tests/ — structural pg_catalog contract test (needs a real Postgres via
#     DBLLM_TEST_PG* env vars) + shell-layer scope propagation tests
#     (subprocess + mocked psql, no DB needed).
testpaths =
    pg-dict/scripts
    tests
python_files = *_test.py test_*.py
